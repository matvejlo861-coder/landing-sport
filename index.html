<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 "Inter Local",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

.two{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}

.plan-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;width:100%;max-width:720px;margin:10px 0 0;overflow:visible}

.plan-preview .pg em{margin-top:7px;font-size:10px;line-height:1.35}
.price{font-size:72px;font-weight:800;line-height:1;color:var(--ac)}

.included{margin-top:18px}

.price-box strong{color:var(--ac);font-size:28px;line-height:1.1}
.price-box small{color:var(--tx);font-size:12px;line-height:1.4}
.terms-links{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 18px;font-size:13px}

.terms-links a:hover,.terms-links a:focus-visible{color:var(--ac)}
.result-action{width:min(100%,720px);margin:clamp(24px,5vw,48px) auto 0;text-align:center}

.preview-exercises li:last-child{border-bottom:0;padding-bottom:0}
.preview-meal{display:grid;grid-template-columns:minmax(76px,96px) minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);text-align:left}
.preview-meal:last-child{border-bottom:0;padding-bottom:0}
.preview-meal span{color:var(--mut);font-size:13px;font-weight:600}

.pay{max-width:520px}
.chk{display:flex;gap:12px;align-items:flex-start;margin:4px 0 16px;cursor:pointer;font-size:14px}

.terms{font-size:14px;color:#d6d6d6;margin-top:16px}
.lnks{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.lnk{background:none;border:0;padding:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px}.lnk:hover{color:var(--tx)}
.st{border-radius:8px;padding:14px 16px;margin:0 0 16px;font-size:14px;border:1px solid var(--bd)}
.st.err{border-color:var(--err);color:var(--err)}.st.ok{border-color:var(--ac);color:var(--ac)}
.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-width:0;padding:12px 0;border-bottom:1px solid var(--bd)}.kv:last-child{border:0}.kv span,.kv b{min-width:0;overflow-wrap:anywhere}.kv b{font-size:clamp(16px,4vw,20px);text-align:right}
.nutrition-card .meal-row{padding:14px 0;border-bottom:1px solid var(--bd)}.nutrition-card .meal-row:last-of-type{border-bottom:0}.nutrition-card .meal-row span{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}.nutrition-card .meal-row b{display:block;font-size:16px;line-height:1.45;overflow-wrap:anywhere}
details{border-bottom:1px solid var(--bd);padding:16px 0}summary{cursor:pointer;font-weight:600;list-style:none}summary::after{content:"+";float:right;color:var(--ac)}details[open] summary::after{content:"–"}

.day{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}.day:last-child{border:0}.day i{font-style:normal;color:var(--ac);font-weight:700;width:32px}
.sheet-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:#000c}

.checkout-kick{text-align:center;margin:0 32px 10px}

.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center}
.photo{aspect-ratio:auto;height:460px}.plan-visual{height:460px}
.btn{width:auto;min-width:min(340px,100%)}.btn.full{width:100%;min-width:0}
